<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LUMA Live</title>
  <!-- 字体：只保留 Playfair Display（开屏用） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 全局样式 -->
  <link rel="stylesheet" href="style.css">
  <!-- 开屏动画：必须在 head 阻塞加载，第一帧即创建遮罩 -->
  <script src="logic/splash.js"></script>
</head>
<body class="h-screen w-screen flex flex-col relative select-none">

  <!-- 隐藏的文件导入选择器 -->
  <input type="file" id="fileInputData" class="hidden" accept=".json">
  <input type="file" id="fileInputPresets" class="hidden" accept=".json">

  <!-- ======================== 顶部导航 Header ======================== -->
  <header class="header-safe-pt px-5 pb-2 flex items-center justify-between z-20 relative" id="mainAppHeader">
    <div class="flex items-center gap-3">
      <div id="mainAppHeaderIconBox" class="w-9 h-9 rounded-2xl bg-gradient-to-br from-slate-900 via-slate-800 to-slate-950 flex items-center justify-center shadow-lg border border-slate-700/50 relative overflow-hidden">
        <svg id="mainAppHeaderIconSvg" class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 id="mainAppHeaderTitle" class="font-black text-base tracking-tight text-slate-900 leading-none">LUMA LIVE</h1>
          <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse shadow-[0_0_8px_#ff2a6d]"></span>
        </div>
        <span id="mainAppHeaderSubtitle" class="text-[9px] text-slate-400 font-bold tracking-widest uppercase mt-0.5 block">Cyber Live Ecosystem</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5 bg-white/60 backdrop-blur-md px-2.5 py-1 rounded-full border border-white shadow-sm">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="mainAppHeaderStatusText" class="text-[10px] font-bold text-slate-700">实时推流中</span>
    </div>
  </header>

  <!-- ======================== 主视图容器 (4大 Tab) ======================== -->
  <main id="pages-root" class="flex-1 overflow-hidden relative z-10">
    <!-- 四个页面由各自 JS 动态注入 -->
  </main>

  <!-- 底部导航栏 -->
  <div class="fixed bottom-0 left-0 right-0 z-30 pb-safe">
    <nav class="dock-glass h-[70px] flex items-center justify-around px-3 pb-2 pt-1">
      <button onclick="switchTab('live')" id="nav-btn-live" class="dock-btn active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
        <span class="text-[9px] font-black">直播</span>
      </button>
      <button onclick="switchTab('trends')" id="nav-btn-trends" class="dock-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span class="text-[9px] font-black">社区</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-btn-profile" class="dock-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span class="text-[9px] font-black">主页</span>
      </button>
      <button onclick="switchTab('settings')" id="nav-btn-settings" class="dock-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span class="text-[9px] font-black">设定</span>
      </button>
    </nav>
  </div>

  <!-- 全屏页面容器：直播间、主播主页、社区子页等由 JS 动态注入 -->
  <div id="fullscreen-root"></div>

  <!-- ==================== 脚本加载顺序 ==================== -->
  <!-- 1. 页面栈管理器 -->
  <script src="page-stack/page-stack.js"></script>
  <!-- 2. 预设管理（core.js 依赖） -->
  <script src="logic/app_presets.js"></script>
  <!-- 3. 核心工具库（存储/AI/网络/工具函数） -->
  <script src="logic/core.js"></script>
  <!-- 3.5 直播间临时存储（依赖 core.js，供 live 层与下播清理使用） -->
  <script src="data/live_room_store.js"></script>
  <!-- 4. 业务逻辑层 -->
  <script src="logic/offline_simulation_engine.js"></script>
  <script src="logic/luma_operations.js"></script>
  <!-- 5. 数据层（data_hub 最先，其他管理器依赖它） -->
  <script src="data/data_hub.js"></script>
  <script src="data/time_keeper.js"></script>
  <script src="data/fans_manager.js"></script>
  <script src="data/guard_manager.js"></script>
  <script src="data/checkin_manager.js"></script>
  <script src="data/titles_manager.js"></script>
  <script src="data/community_store.js"></script>
  <!-- 5. 四个主页面（各自注入自己的 HTML） -->
  <script src="LIVE/live/live.js"></script>
  <script src="LIVE/community/community.js"></script>
  <script src="LIVE/home/home.js"></script>
  <script src="LIVE/settings/settings.js"></script>
  <script src="logic/modals.js"></script>
  <!-- 6. 社区全屏页面 HTML -->
  <script src="LIVE/community/community_pages.js"></script>
  <!-- 7. 社区子模块（按依赖顺序） -->
  <script src="LIVE/community/module_detail.js"></script>
  <script src="LIVE/community/module_ranking.js"></script>
  <script src="LIVE/community/module_trends.js"></script>
  <script src="LIVE/community/module_supertopic.js"></script>
  <script src="LIVE/community/module_mytopic.js"></script>
  <script src="LIVE/community/module_forum.js"></script>
  <!-- 8.1 直播设置模块 -->
  <script src="LIVE/community/module_live_settings.js"></script>
  <!-- 8.2 直播设置·直播间音乐子模块 -->
  <script src="LIVE/community/module_live_music.js"></script>
  <!-- 8. 社区入口（依赖所有子模块，最后加载） -->
  <script src="LIVE/community/trends.js"></script>
  <!-- 9. 直播全屏页面 HTML -->
  <script src="LIVE/live/live_pages.js"></script>
  <!-- 10. 直播逻辑（room_loading 先加载，live_logic 依赖它） -->
  <script src="LIVE/live/room_loading.js"></script>
  <script src="LIVE/live/live_logic.js"></script>
  <!-- 10.3 直播间视频背景 -->
  <script src="LIVE/live/live_background.js"></script>
  <!-- 10.5 礼物系统（依赖直播间容器，在直播模块之后加载） -->
  <script src="logic/gift_system.js"></script>
  <!-- 11. 主页全屏页面 HTML -->
  <script src="LIVE/home/home_pages.js"></script>
  <!-- 12. 主页逻辑 -->
  <script src="LIVE/home/profile.js"></script>
  <script src="LIVE/home/streamer_profile.js"></script>
  <!-- 13. 设定页交互逻辑 -->
  <script src="LIVE/settings/main.js"></script>
  <!-- 14. 主入口初始化（最后） -->
  <script src="logic/main.js"></script>
</body>
</html>
