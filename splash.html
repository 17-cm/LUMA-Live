<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LUMA - 开启你的直播之旅</title>
  <!-- 引入高级现代极简与花体衬线字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@1,600;1,800&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 模拟小手机容器 / 全屏画布 */
    .splash-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      max-height: 920px;
      background: radial-gradient(circle at 50% 45%, #0f172a 0%, #050814 60%, #02040a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 24px) + 16px) 24px calc(env(safe-area-inset-bottom, 24px) + 24px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(255, 255, 255, 0.05);
      border-radius: clamp(0px, 4vw, 40px);
      overflow: hidden;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease-out;
    }

    /* 背景霓虹极光微动效 */
    .ambient-glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.18) 0%, rgba(139, 92, 246, 0.15) 45%, rgba(6, 182, 212, 0.08) 70%, transparent 85%);
      filter: blur(48px);
      pointer-events: none;
      animation: ambientPulse 4s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes ambientPulse {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.95; }
    }

    /* 顶部左上角：跳过交互按钮（避开宿主胶囊） */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      z-index: 20;
    }

    .skip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(241, 245, 249, 0.85);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .skip-btn:active {
      transform: scale(0.94);
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(244, 63, 94, 0.4);
    }

    .skip-count {
      color: #f43f5e;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    /* 中央核心品牌区 */
    .brand-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      margin-top: -30px;
    }

    /* LUMA 逐字逐光动效容器 */
    .logo-letters {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', 'Cinzel', serif;
      font-size: clamp(54px, 14vw, 76px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 6px;
      position: relative;
    }

    /* 单个字母逐字显现与霓虹点亮 */
    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px) scale(0.9);
      color: transparent;
      -webkit-text-stroke: 1.2px rgba(255, 255, 255, 0.25);
      filter: drop-shadow(0 0 0 transparent);
      transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 点亮后的霓虹轻奢质感 */
    .char.lit {
      opacity: 1;
      transform: translateY(0) scale(1);
      color: #ffffff;
      -webkit-text-stroke: 0px transparent;
      background: linear-gradient(135deg, #ffffff 15%, #ffe4e6 45%, #f43f5e 80%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(244, 63, 94, 0.65)) drop-shadow(0 0 35px rgba(168, 85, 247, 0.4));
    }

    /* 全字合成后的高光呼吸爆闪特效 */
    .logo-letters.bloom {
      animation: logoBloom 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards, logoFloatBreath 3s ease-in-out infinite alternate 0.7s;
    }

    @keyframes logoBloom {
      0% {
        filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.5));
      }
      40% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 32px rgba(244, 63, 94, 0.95)) drop-shadow(0 0 60px rgba(6, 182, 212, 0.75));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.75)) drop-shadow(0 0 40px rgba(168, 85, 247, 0.5));
      }
    }

    @keyframes logoFloatBreath {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    /* 副标题：开启你的直播之旅 */
    .slogan-box {
      margin-top: 14px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slogan-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    .slogan-text {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 4px;
      padding-left: 4px; /* 视觉平衡字间距 */
      color: rgba(226, 232, 240, 0.85);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slogan-text::before,
    .slogan-text::after {
      content: '';
      display: inline-block;
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(244, 63, 94, 0.6), transparent);
    }

    /* 底部区域：进度与版权小字 */
    .bottom-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    /* 极细霓虹进度条 */
    .progress-bar-wrap {
      width: 110px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f43f5e, #a855f7, #38bdf8);
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.8);
      transition: width 2s linear;
      border-radius: 999px;
    }

    /* 底部专属小字 */
    .footer-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .footer-brand {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(148, 163, 184, 0.6);
      text-transform: uppercase;
    }

    .footer-sub {
      font-size: 8px;
      color: rgba(100, 116, 139, 0.5);
      letter-spacing: 0.5px;
    }

    /* 离场转场动画 */
    .splash-container.exit {
      transform: scale(1.08);
      opacity: 0;
      pointer-events: none;
    }

    /* 独立预览模式下的操作辅助栏 */
    .preview-control-bar {
      position: fixed;
      bottom: 16px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .preview-btn {
      background: #f43f5e;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 主启动容器 -->
  <div class="splash-container" id="splashScreen">
    <!-- 背景流光 -->
    <div class="ambient-glow"></div>

    <!-- 顶部左上角：跳过交互 -->
    <div class="top-bar">
      <button class="skip-btn" id="skipBtn" onclick="handleSkipOrComplete()">
        <span>跳过</span>
        <span class="skip-count" id="skipCounter">3s</span>
      </button>
    </div>

    <!-- 中央品牌标识区域 -->
    <div class="brand-stage">
      <!-- 花体 LUMA 逐字显示 -->
      <div class="logo-letters" id="logoLetters">
        <span class="char" id="char-0">L</span>
        <span class="char" id="char-1">U</span>
        <span class="char" id="char-2">M</span>
        <span class="char" id="char-3">A</span>
      </div>

      <!-- 副标题 -->
      <div class="slogan-box" id="sloganBox">
        <p class="slogan-text">开启你的直播之旅</p>
      </div>
    </div>

    <!-- 底部细节与加载进度 -->
    <div class="bottom-section">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="footer-meta">
        <span class="footer-brand">LUMA LIVE · VIRTUAL SANDBOX</span>
        <span class="footer-sub">AI Live Streaming Simulation Engine</span>
      </div>
    </div>
  </div>

  <!-- 浏览器直接预览辅助条（仅供您测试重播） -->
  <div class="preview-control-bar" id="previewHelper">
    <span>📱 启动页效果预览中</span>
    <button class="preview-btn" onclick="playSplashAnimation()">重播动效</button>
    <button class="preview-btn" style="background:#334155;" onclick="enterMainApp()">进入主程序</button>
  </div>

  <script>
    let timerId = null;
    let isExited = false;

    // 核心动效控制器
    function playSplashAnimation() {
      // 重置状态
      isExited = false;
      const container = document.getElementById('splashScreen');
      const logo = document.getElementById('logoLetters');
      const slogan = document.getElementById('sloganBox');
      const progress = document.getElementById('progressFill');
      const counter = document.getElementById('skipCounter');
      
      container.classList.remove('exit');
      logo.classList.remove('bloom');
      slogan.classList.remove('show');
      progress.style.transition = 'none';
      progress.style.width = '0%';
      counter.textContent = '3s';

      const chars = [
        document.getElementById('char-0'),
        document.getElementById('char-1'),
        document.getElementById('char-2'),
        document.getElementById('char-3')
      ];

      chars.forEach(c => c.classList.remove('lit'));

      // 启动进度条 (3000ms 填满)
      setTimeout(() => {
        progress.style.transition = 'width 3000ms cubic-bezier(0.2, 0.8, 0.2, 1)';
        progress.style.width = '100%';
      }, 50);

      // 1. 逐字依次点亮 L -> U -> M -> A (从容优雅的节奏)
      setTimeout(() => chars[0].classList.add('lit'), 200);
      setTimeout(() => chars[1].classList.add('lit'), 550);
      setTimeout(() => chars[2].classList.add('lit'), 900);
      setTimeout(() => chars[3].classList.add('lit'), 1250);

      // 2. 全部显示完成后：整体光晕呼吸闪烁特效 (1550ms)
      setTimeout(() => {
        logo.classList.add('bloom');
      }, 1550);

      // 3. 副标题优雅淡入展开 (1700ms)
      setTimeout(() => {
        slogan.classList.add('show');
      }, 1700);

      // 4. 倒计时数字递减
      setTimeout(() => {
        if (!isExited) counter.textContent = '2s';
      }, 1000);

      setTimeout(() => {
        if (!isExited) counter.textContent = '1s';
      }, 2000);

      // 5. 整体 3 秒到达，执行平滑转场离场 (3000ms)
      if (timerId) clearTimeout(timerId);
      timerId = setTimeout(() => {
        handleSkipOrComplete();
      }, 3050);
    }

    // 点击跳过或时间到达
    function handleSkipOrComplete() {
      if (isExited) return;
      isExited = true;
      if (timerId) clearTimeout(timerId);

      const container = document.getElementById('splashScreen');
      container.classList.add('exit');

      // 提示或跳转主程序
      console.log('启动完成，准备平滑进入直播主界面');
    }

    function enterMainApp() {
      window.location.href = 'index.html';
    }

    // 页面加载完成后立即自动播放
    window.addEventListener('DOMContentLoaded', () => {
      playSplashAnimation();
    });
  </script>
</body>
</html>
