<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>注入测试 - LUMA Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f7; height: 100vh; display: flex; flex-direction: column; }
    .tab-page { flex: 1; overflow-y: auto; padding: 20px; display: none; }
    .tab-page.active { display: block; }
    .tab-bar { display: flex; border-top: 1px solid #e0e0e0; background: white; padding-bottom: env(safe-area-inset-bottom); }
    .tab-btn { flex: 1; padding: 12px 0; text-align: center; cursor: pointer; font-size: 13px; color: #999; }
    .tab-btn.active { color: #6366f1; font-weight: 700; }
    .full-page { position: fixed; inset: 0; background: white; z-index: 100; display: none; padding: 20px; overflow-y: auto; }
    .full-page.open { display: block; }
    .result { margin: 8px 0; padding: 10px 14px; border-radius: 10px; font-size: 13px; }
    .pass { background: #dcfce7; color: #166534; }
    .fail { background: #fee2e2; color: #991b1b; }
    button { padding: 10px 18px; margin: 6px 4px; border: none; border-radius: 10px; background: #6366f1; color: white; font-size: 14px; cursor: pointer; }
    button.secondary { background: #e0e7ff; color: #4338ca; }
    h2 { font-size: 18px; margin-bottom: 12px; color: #1f2937; }
    h3 { font-size: 15px; margin: 16px 0 8px; color: #374151; }
    p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 8px; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 20px; }
  </style>
</head>
<body>
  <!-- 页面容器：所有页面由 JS 动态注入 -->
  <div id="pages-root"></div>

  <!-- 底部 Tab 栏（静态公共部分） -->
  <div class="tab-bar">
    <div class="tab-btn active" onclick="switchTab('live')">直播</div>
    <div class="tab-btn" onclick="switchTab('community')">社区</div>
    <div class="tab-btn" onclick="switchTab('home')">主页</div>
    <div class="tab-btn" onclick="switchTab('settings')">设定</div>
  </div>

  <script src="test-inject.js"></script>
</body>
</html>
